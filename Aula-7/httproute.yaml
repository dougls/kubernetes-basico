apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minimal-api-route
  namespace: prod
spec:
  parentRefs:
  - name: prod-gateway
    namespace: network
  hostnames:
  - "api.k8scluster.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/vendas
    backendRefs:
    - name: minimal-api-svc
      port: 80
      weight: 90 # Canary deploy
    - name: minimal-api-np
      port: 80
      weight: 10
