# ingress-api.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-api-ingress
  namespace: prod
# annotations:
#   alb.ingress.kubernetes.io/auth-session-cookie: Ingress
#   alb.ingress.kubernetes.io/auth-session-timeout: '604800'
#   alb.ingress.kubernetes.io/actions.${action-name}
#   alb.ingress.kubernetes.io/conditions.${conditions-name}
#   alb.ingress.kubernetes.io/target-node-labels
spec:
  ingressClassName: nginx
  rules:
  - host: api.k8scourse.local # O domínio limpo (FQDN)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minimal-api-svc # Conectando com o Service de Camada 4
            port:
              number: 80