apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: prod
type: Opaque
data:
  POSTGRES_PASSWORD: QVNKZGFzSERBSVNkaHVlMjQzNDM=

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: prod
spec:
  serviceName: "postgres-headless" # video 3
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres-db
        image: postgres:14
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data-pg
          mountPath: /var/lib/postgresql/data    
  volumeClaimTemplates:
  - metadata:
      name: data-pg
    spec:
      storageClassName: "standard"
      accessModes: ["ReadWriteOnce"] # ReadOnlyMany # ReadWriteMany # ReadWriteOncePod 
      resources:
        requests:
          storage: 10Gi
        limits:
          storage: 15Gi        
