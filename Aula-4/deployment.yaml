apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-api-net
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minimal-api
  template:
    metadata:
      labels:
        app: minimal-api
    spec:
      containers:
      - name: api-container
        image: minimal-api-net:latest
        imagePullPolicy: Never # Always | Never | IfNotPresent ##Opcional
        ports:
          - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

