apiVersion: v1
kind: Pod
metadata:
  name: dotnet-api
  namespace: dev
  labels:
    version: v1
    app: dotnet-api
spec:
  containers:
  - name: api-container
    image: minimal-api-net:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
      name: api
    resources:
      requests: 
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
